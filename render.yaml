databases:
  - name: propel-grid-db
    plan: free
    databaseName: propel_grid
    user: propel

services:
  - type: redis
    name: propel-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: propel-grid-monitor
    plan: free
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: propel-grid-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: propel-redis
          type: redis
          property: connectionString
